[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vietnamese-legal-agentic-rag"
version = "0.1.0"
description = "Hệ thống hỏi đáp tra cứu văn bản quy phạm pháp luật Việt Nam có kiểm chứng sử dụng Agentic RAG (LangGraph + BGE-M3 + BM25 + Citation Verification)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "AI Engineer Team", email = "team@example.com" }
]
keywords = [
    "rag",
    "agentic-rag",
    "langgraph",
    "vietnamese-legal",
    "legal-nlp",
    "bge-m3",
    "bm25",
    "citation-grounding"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Data & Validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    
    # API & Serving
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    
    # Ingestion & Parsing
    "pymupdf>=1.23.0",
    "beautifulsoup4>=4.12.0",
    
    # Retrieval & Search (Dense + Sparse)
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pyvi>=0.1.1",
    "chromadb>=0.4.24",
    
    # Agent Orchestration
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    
    # Utilities & Observability
    "loguru>=0.7.2",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "types-pyyaml>=6.0.12.20240311"
]
eval = [
    "ragas>=0.1.5",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# -----------------------------------------------------------------------------
# Ruff Linter & Formatter Configuration
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "notebooks"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF"   # ruff-specific rules
]
ignore = [
    "E501", # Line length handled by formatter
    "B008"  # Do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# -----------------------------------------------------------------------------
# Pytest Configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Quick unit tests isolating deterministic logic",
    "integration: End-to-end component integration tests (retrieval, vector store)",
    "eval: Benchmark evaluation runs on gold evaluation datasets",
    "slow: Tests that download models or run heavy inference"
]

# -----------------------------------------------------------------------------
# Mypy Type Checker Configuration
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
