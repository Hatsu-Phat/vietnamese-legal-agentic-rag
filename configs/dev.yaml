# ==============================================================================
# Development Configuration (configs/dev.yaml)
# Vietnamese Legal Agentic RAG Pipeline Parameters
# ==============================================================================

pipeline:
  name: "vietnamese-legal-agentic-rag"
  version: "0.1.0"
  environment: "development"

# ------------------------------------------------------------------------------
# LLM Provider Configuration
# ------------------------------------------------------------------------------
llm:
  provider: "gemini"
  model_id: "gemini-2.5-flash"
  temperature: 0.0
  timeout_seconds: 30


# ------------------------------------------------------------------------------
# Chunking Strategy Configuration
# ------------------------------------------------------------------------------
chunking:
  strategy: "hierarchical_provision"
  max_words_per_chunk: 400        # Tương đương ~512 subword tokens của BGE-M3
  overlap_words: 50               # Tương đương ~64 subword tokens
  min_words_per_chunk: 15
  include_breadcrumb_in_embedding_text: true
  output_chunks_path: "data/processed/chunks.jsonl"
  chunk_stats_path: "data/manifests/chunk_stats.json"

# ------------------------------------------------------------------------------
# Indexing Configuration (BM25 + Qdrant)
# ------------------------------------------------------------------------------
indexing:
  manifest_path: "data/manifests/index_manifest.json"
  bm25:
    index_path: "data/indexes/bm25/bm25_index.pkl"
    corpus_meta_path: "data/indexes/bm25/bm25_chunk_ids.json"
    segment_vietnamese: true
    stopwords_path: "data/raw/stopwords.txt"
    k1: 1.2
    b: 0.65
  qdrant:
    mode: "local"                 # "local" (lưu trên đĩa) hoặc "server" (Docker Qdrant)
    local_path: "data/indexes/qdrant"
    url: "http://localhost:6333"
    collection_name: "vn_legal_bge_m3"
    embedding_model_id: "BAAI/bge-m3"
    vector_size: 1024
    distance: "Cosine"
    normalize_embeddings: true
    batch_size: 32
    max_seq_length: 512
    on_disk_payload: true


# ------------------------------------------------------------------------------
# Hybrid Retrieval Configuration
# ------------------------------------------------------------------------------
retrieval:
  # Dense Retrieval via BGE-M3
  dense:
    enabled: true
    model_name: "BAAI/bge-m3"
    top_k: 10
    batch_size: 16

  # Sparse Keyword Retrieval via BM25
  sparse:
    enabled: true
    engine: "rank_bm25"
    top_k: 10
    # Enable word segmentation for Vietnamese sparse query matching
    segment_vietnamese: true

  # Rank Fusion via Reciprocal Rank Fusion (RRF)
  fusion:
    method: "rrf"
    rrf_k: 60
    top_candidates: 10

  # Cross-Encoder Reranking (Disabled in baseline MVP, evaluated in Phase 5)
  reranking:
    enabled: false
    model_name: "BAAI/bge-reranker-v2-m3"
    top_n: 5

# ------------------------------------------------------------------------------
# LangGraph Agentic Workflow Configuration
# ------------------------------------------------------------------------------
agent:
  # Strict loop bounds to prevent infinite tool calling
  max_retrieval_rounds: 2
  # Enforce citation audit before generating final answer
  require_citation_verification: true
  # Abstention policy: reject if evidence confidence is insufficient or ambiguous
  abstention_threshold: 0.4
  timeout_seconds: 30

# ------------------------------------------------------------------------------
# Storage & Persistence
# ------------------------------------------------------------------------------
storage:
  vector_store:
    provider: "chroma"
    persist_dir: "./data/indexes/chroma"
    collection_name: "legal_provisions_v1"
  metadata_store:
    provider: "sqlite"
    db_path: "./data/metadata.db"
